services:
  postgres:
    image: postgres:16-alpine
    container_name: countywyde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: countywyde
      POSTGRES_USER: countywydeadminuser
      POSTGRES_PASSWORD: purplecrayonorangeblanket
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U countywydeadminuser -d countywyde" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
